<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact</title>
<style>body{margin:0;background:#f2f4f8;color:#14213d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.top{background:#0b1b3a;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.top a{color:#fff;text-decoration:none;font-weight:600}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}.box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(15,30,70,.06)}
h1{font-size:24px;margin:0 0 10px}h2{font-size:17px;margin:20px 0 6px}p,li{font-size:15px}a{color:#0a84ff}.m{color:#6b7690;font-size:13px}</style></head>
<body><div class="top"><a href="index.html">&larr; <span data-site>Authorized Service Centers</span></a></div>
<main><div class="box"><h1>Contact</h1><p>For corrections, suggestions or questions about this website, get in touch with us:</p>
<p>Email: <span id="em"></span></p><p>WhatsApp: <span id="ph"></span></p>
<p class="m">Please mention the brand and service center name when reporting a correction.</p></div></main>
<script>(async()=>{let D=null;try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(r.ok)D=await r.json()}catch(e){}
if(!D){try{D=JSON.parse(localStorage.getItem('asc_data_v1'))}catch(e){}}
const s=(D&&D.site)||{};document.querySelectorAll('[data-site]').forEach(e=>e.textContent=s.title||'Authorized Service Centers');
const em=document.getElementById('em'),ph=document.getElementById('ph');
if(em){if(s.cEmail){const a=document.createElement('a');a.href='mailto:'+s.cEmail;a.textContent=s.cEmail;em.appendChild(a)}else em.parentElement.style.display='none'}
if(ph){const d=(s.cPhone||'').replace(/[^\d]/g,'');if(d){const a=document.createElement('a');a.href='https://wa.me/'+d;a.target='_blank';a.rel='noopener';a.textContent='+'+d+' (WhatsApp)';ph.appendChild(a)}else ph.parentElement.style.display='none'}
})();</script></body></html>
